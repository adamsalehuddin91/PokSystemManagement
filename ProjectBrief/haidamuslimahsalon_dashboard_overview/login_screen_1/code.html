<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Salonee Login | Muslimah Salon Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7de830",
                        "background-light": "#f9f7f2",
                        "background-dark": "#182111",
                        "accent-gold": "#d4af37",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .botanical-pattern {
            background-image: radial-gradient(circle at 2px 2px, rgba(125, 232, 48, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center botanical-pattern p-4">
<div class="layout-container flex h-full grow flex-col max-w-[1200px] w-full">
<div class="flex flex-1 justify-center py-10">
<div class="layout-content-container flex flex-col w-full max-w-[480px]">
<!-- Logo / Brand Identity -->
<div class="flex flex-col items-center gap-4 mb-8">
<div class="bg-white dark:bg-zinc-800 p-4 rounded-full shadow-sm border border-primary/20">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="spa">spa</span>
</div>
<div class="text-center">
<h2 class="text-[#141811] dark:text-white text-2xl font-bold leading-tight tracking-tight">Salonee</h2>
<p class="text-[#728863] dark:text-zinc-400 text-sm font-medium">Muslimah Salon Management</p>
</div>
</div>
<!-- Login Card -->
<div class="bg-white dark:bg-zinc-900 rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-[#e0e5dc] dark:border-zinc-800 overflow-hidden">
<div class="p-8">
<h1 class="text-[#141811] dark:text-white tracking-tight text-2xl font-bold leading-tight text-center mb-2">Welcome Back</h1>
<p class="text-[#728863] dark:text-zinc-400 text-sm font-normal leading-normal text-center mb-8">Manage your salon with peace and grace.</p>
<form class="space-y-6">
<!-- Email/Phone Field -->
<div class="flex flex-col gap-2">
<label class="text-[#141811] dark:text-zinc-200 text-sm font-semibold leading-normal">Email or Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#728863] text-xl">mail</span>
<input class="form-input flex w-full rounded-xl text-[#141811] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e0e5dc] dark:border-zinc-700 bg-white dark:bg-zinc-800 focus:border-primary h-14 placeholder:text-[#728863]/50 pl-12 pr-4 text-base font-normal" placeholder="sister@salon.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-[#141811] dark:text-zinc-200 text-sm font-semibold leading-normal">Password</label>
<a class="text-primary text-xs font-bold hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#728863] text-xl">lock</span>
<input class="form-input flex w-full rounded-xl text-[#141811] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#e0e5dc] dark:border-zinc-700 bg-white dark:bg-zinc-800 focus:border-primary h-14 placeholder:text-[#728863]/50 pl-12 pr-12 text-base font-normal" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-[#728863]" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Toggle -->
<div class="flex items-center gap-2 px-1">
<input class="w-4 h-4 rounded border-[#e0e5dc] text-primary focus:ring-primary/30" id="remember" type="checkbox"/>
<label class="text-sm text-[#728863] dark:text-zinc-400" for="remember">Keep me logged in</label>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-opacity-90 text-[#141811] font-bold text-base h-14 rounded-xl transition-all shadow-md active:scale-[0.98]">
                                Login to Dashboard
                            </button>
</form>
</div>
<!-- Footer Section within Card -->
<div class="bg-[#f2f4f0]/50 dark:bg-zinc-800/50 p-6 border-t border-[#e0e5dc] dark:border-zinc-800 text-center">
<p class="text-[#728863] dark:text-zinc-400 text-sm">
                            Need help? <a class="text-[#141811] dark:text-white font-bold hover:underline" href="#">Contact Admin Support</a>
</p>
</div>
</div>
<!-- Subtle Decorative Element -->
<div class="mt-12 flex justify-center opacity-20 pointer-events-none">
<div class="w-32 h-32 bg-center bg-no-repeat bg-contain" data-alt="Soft watercolor botanical line art illustration" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDkq5teGhPPa9Y83yrrqRN_ahj35hMzHZeTScrlmEEeFsk5YwYVE-2RUmDzBbNNY5yayaSU8Ew1yd1tqpVFkIoN_WueBjQSMdDzFk0N2VbF7kkjo5qGYgOhZfH3torEHAkwo0vGfTCbVxGU2E8EiPuxKGvuuibba6NY58j_-iH_is6qyaIdpgnbIrHFz8iPXbqrvuFrvOg8Zqn_PA8kkYDvqfSkBtRTgfpz75jZz5bYno-sHQZjgx07tqkD_CA7cxX3_HxRrBXhUKfl");'>
</div>
</div>
</div>
</div>
</div>
</body></html>
